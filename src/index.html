<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handlebars & Parcel</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <h1>Магазин продуктів</h1>
    <form id="add-form">
        <h3>Додати новий продукт</h3>
        <input type="text" id="product-name" placeholder="Назва (name)" required>
        <input type="number" id="product-price" placeholder="Ціна (price)" required>
        <input type="text" id="product-desc" placeholder="Опис (description)" required>
        <button type="submit">Додати</button>
    </form>
    <div id="products-container"></div>
    <script type="module" src="./index.js"></script>
</body>

</html>
